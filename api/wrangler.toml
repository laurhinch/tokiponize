name = "tokiponize"
main = "worker.mjs"
compatibility_date = "2026-08-01"

# route patterns are matched against the query string as well, so a
# pattern without a trailing * never sees /?nimi=x or /og.png?nimi=x.
# everything the worker does not handle is passed straight to Pages.
routes = [
  { pattern = "nimi.toki.li/*", zone_name = "toki.li" },
]
