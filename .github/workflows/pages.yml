name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Assemble site
        run: |
          mkdir -p _site
          cp -r site/. _site/
          rm -rf _site/lib
          mkdir -p _site/lib
          cp dist/*.js _site/lib/
          rm -f _site/lib/cli.js

          # a module the page cannot resolve takes down every script on it,
          # so check the graph before this ships
          missing=0
          for f in _site/lib/*.js; do
            for dep in $(sed -n 's|.*from "\./\([^"]*\)".*|\1|p' "$f"); do
              [ -f "_site/lib/$dep" ] || { echo "$f imports $dep, which is missing" >&2; missing=1; }
            done
          done
          [ "$missing" = 0 ]

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
