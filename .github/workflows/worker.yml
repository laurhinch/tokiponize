name: Deploy Worker

# the worker bundles dist/, so it redeploys when the library changes too
on:
  push:
    branches: [main]
    paths:
      - api/**
      - src/**
      - package.json
      - package-lock.json
      - .github/workflows/worker.yml
  workflow_dispatch:

concurrency:
  group: worker
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - run: npm ci
      - run: npm test
      - run: npm run build

      # the id is a resource handle rather than a credential, but it is one
      # line to keep it out of the repo, so it lives in a secret. wrangler
      # does not read env vars out of its own config file.
      - name: Point the D1 binding at the database
        env:
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
        run: |
          if [ -z "$D1_DATABASE_ID" ]; then
            echo "the D1_DATABASE_ID secret is not set" >&2
            exit 1
          fi
          sed -i "s|^database_id = \"set-by-ci\".*|database_id = \"$D1_DATABASE_ID\"|" \
            api/wrangler.toml
          if grep -q 'set-by-ci' api/wrangler.toml; then
            echo "the placeholder is still there, substitution missed" >&2
            exit 1
          fi

      # before the deploy, so the table is never younger than the worker
      # writing to it. D1 records what it has run, so this is a no-op once
      # every migration has been applied.
      - name: Apply D1 migrations
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: >-
            d1 migrations apply tokiponize-suggestions --remote
            --config api/wrangler.toml

      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config api/wrangler.toml

      # a broken worker still serves the site, so it needs saying out loud
      - name: Check the worker answers
        run: |
          UA="Mozilla/5.0 (compatible; tokiponize-ci/1.0)"
          get() { curl -sS -m 20 -A "$UA" -w '\n%{http_code}' "https://nimi.toki.li$1"; }
          # the image needs og-atlas.json, which Pages deploys in parallel
          for i in $(seq 12); do
            sleep 10
            api=$(get "/api/tokiponize?name=Jakarta")
            img=$(get "/og.png?nimi=Jakarta")
            page=$(get "/?nimi=Jakarta")
            codes="$(echo "$api" | tail -1) $(echo "$img" | tail -1) $(echo "$page" | tail -1)"
            case "$codes" in
              *403*)
                echo "cloudflare blocked this runner ($codes), cannot verify from CI"
                exit 0 ;;
            esac
            if echo "$api" | grep -q Jakata &&
               [ "$(echo "$img" | tail -1)" = 200 ] &&
               echo "$page" | grep -qE 'og:title[^>]*Jakata'; then
              echo "worker is answering"
              exit 0
            fi
            echo "attempt $i: $codes"
          done
          echo "worker did not answer correctly after deploy" >&2
          exit 1
